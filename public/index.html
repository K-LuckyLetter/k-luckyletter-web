<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K-LuckyLetter</title>
<link rel="canonical" href="/en">
<script>
  // 언어 없는 첫 주소로 온 사람을 브라우저 언어에 맞는 화면으로 보낸다.
  var supported = ['en', 'ko', 'ja', 'zh'];
  var wanted = (navigator.languages || [navigator.language || 'en']).map(function (l) { return l.slice(0, 2).toLowerCase(); });
  var locale = wanted.filter(function (l) { return supported.indexOf(l) >= 0; })[0] || 'en';
  location.replace('/' + locale + location.search + location.hash);
</script>
</head>
<body>
<noscript><a href="/en">English</a> · <a href="/ko">한국어</a> · <a href="/ja">日本語</a> · <a href="/zh">中文</a></noscript>
</body>
</html>
